services:
  - type: web
    name: line-deepseek-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_BOT_USER_ID
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SYSTEM_PROMPT
        value: 你是一位聰明、友善且條理分明的 AI 助理，請一律使用繁體中文（台灣習慣用語）回答問題。
